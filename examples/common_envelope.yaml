# Preset 1: wide non-interacting massive binary -- winds only, no RLOF.
system: {m1: 30.0, m2: 12.0, separation: 45.0, period: null, eccentricity: 0.0,
         metallicity: 0.0142, spin1: 0.0, spin2: 0.0, max_age: null}
theories: {gravity: "2.5PN", wind: "vink2001", convection: "ledoux", overshoot: "exponential",
           am_transport: "tayler_spruit", mt_stability: "zeta", mt_rate: "kolb_ritter",
           ce_formalism: "alpha_lambda", opacity: "kramers", reaction_rates: "reaclib",
           sn_engine: "delayed", tides: "hut1981", structure_fidelity: "semi_analytic", third_body: false}
free_parameters:
  alpha_mlt:      {value: 1.82,  range: [1.5, 2.2],    ref: "solar-calibrated"}
  f_overshoot:    {value: 0.019, range: [0.0, 0.04],   ref: "Brott+ 2011"}
  f0_overshoot:   {value: 0.005, range: [0.0, 0.01],   ref: "Herwig 2000"}
  alpha_sc:       {value: 1.0,   range: [0.001, 100.0], ref: "Langer+ 1983"}
  eta_wind:       {value: 1.0,   range: [0.1, 3.0],    ref: "convention"}
  clumping:       {value: 1.0,   range: [1.0, 10.0],   ref: "Vink 2001 smooth"}
  beta_accretion: {value: 0.5,   range: [0.0, 1.0],    ref: "Petrovic+ 2005"}
  gamma_amloss:   {value: 1.3,   range: [1.0, 4.0],    ref: "Nelemans+ 2000"}
  alpha_ce:       {value: 1.0,   range: [0.1, 10.0],   ref: "Ivanova+ 2013"}
  lambda_ce:      {value: 0.5,   range: [0.05, 2.0],   ref: "Xu & Li 2010"}
  c12_ag_rate:    {value: 1.0,   range: [0.6, 1.6],    ref: "deBoer+ 2017"}
  kick_sigma:     {value: 265.0, range: [0.0, 400.0],  ref: "Hobbs+ 2005"}
  overshoot_step: {value: 0.335, range: [0.0, 0.5],    ref: "Ekstrom+ 2012"}
numerics: {orbit_integrator: "ias15", secular_integrator: "dop853", network_integrator: "radau",
           rtol: 1.0e-10, atol: 1.0e-12, max_time: 6.0e7, energy_drift_tol: 1.0e-6,
           am_drift_tol: 1.0e-6, min_dt: 1.0e-3, max_dt: 1.0e5, seed: 42}
output: {dir: "outputs/ce", hdf5_name: "run.h5", make_figures: true, figure_format: "png"}
